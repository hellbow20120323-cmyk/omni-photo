[package]
name = "omni-photo"
version = "0.1.0"
description = "Omni Photo — cross-platform photo organizer (全能照片管家)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "fs-create-dir", "fs-read-file", "fs-read-dir", "fs-copy-file", "fs-write-file", "window-all", "dialog-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
chrono = "0.4"
exif = { package = "kamadak-exif", version = "0.6" }
regex = "1.10"
rayon = "1.8"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }

[features]
# Tauri CLI passes `--features custom-protocol` on release builds; root crate must declare it. (release 需声明 custom-protocol)
custom-protocol = ["tauri/custom-protocol"]
